<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Textile ERP</title>
<style>
  :root{
    --navy:#0f172a; --navy2:#1e293b; --accent:#2563eb; --bg:#f1f5f9; --card:#ffffff;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px}
  #root{height:100%}
  .app{display:flex; min-height:100vh}
  .sidebar{width:230px; background:var(--navy); color:#cbd5e1; display:flex; flex-direction:column;
    position:fixed; top:0; bottom:0; left:0}
  .brand{padding:20px 18px; font-weight:700; color:#fff; font-size:16px; letter-spacing:.3px;
    border-bottom:1px solid #1e293b}
  .brand small{display:block; color:#64748b; font-weight:500; font-size:11px; margin-top:3px}
  .nav{padding:10px 8px; overflow:auto}
  .nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0;
    background:transparent; color:#cbd5e1; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13.5px}
  .nav button:hover{background:#1e293b; color:#fff}
  .nav button.active{background:var(--accent); color:#fff}
  .nav .group{color:#475569; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; padding:14px 12px 4px}
  .main{margin-left:230px; flex:1; display:flex; flex-direction:column; min-width:0}
  .topbar{background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex;
    justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5}
  .topbar h1{font-size:17px; margin:0}
  .topbar .who{color:var(--muted); font-size:12.5px}
  .content{padding:24px; max-width:1200px}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; margin-bottom:22px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
    box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .card .label{color:var(--muted); font-size:12px; margin-bottom:8px}
  .card .value{font-size:22px; font-weight:700}
  .card .value.pos{color:var(--ok)} .card .value.neg{color:var(--bad)}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:22px}
  .panel h3{margin:0 0 14px; font-size:14px; padding-bottom:10px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px}
  .panel h3::before{content:""; width:4px; height:15px; border-radius:3px; background:var(--accent)}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  tbody tr{transition:background .1s} tbody tr:hover{background:#f8fafc}
  .badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600}
  .badge.ok{background:#dcfce7; color:#166534} .badge.bad{background:#fee2e2; color:#991b1b}
  .badge.warn{background:#fef3c7; color:#92400e} .badge.info{background:#dbeafe; color:#1e40af}

  /* KPI stat cards (dashboard) */
  .stats{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:16px; margin-bottom:22px}
  .stat{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; gap:14px;
    align-items:flex-start; box-shadow:0 1px 3px rgba(15,23,42,.05); transition:box-shadow .15s,transform .15s}
  .stat:hover{box-shadow:0 6px 18px rgba(15,23,42,.08); transform:translateY(-1px)}
  .stat-icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:21px; flex:0 0 auto; background:#eff6ff; color:#2563eb}
  .stat.green .stat-icon{background:#dcfce7; color:#16a34a}
  .stat.violet .stat-icon{background:#ede9fe; color:#7c3aed}
  .stat.amber .stat-icon{background:#fef3c7; color:#d97706}
  .stat.teal .stat-icon{background:#ccfbf1; color:#0d9488}
  .stat.rose .stat-icon{background:#ffe4e6; color:#e11d48}
  .stat-body{min-width:0}
  .stat-label{color:var(--muted); font-size:12.5px; margin-bottom:5px}
  .stat-value{font-size:22px; font-weight:700; letter-spacing:-.01em}
  .stat-delta{font-size:11.5px; font-weight:600; margin-top:5px; color:var(--muted)}
  .stat-delta.up{color:var(--ok)} .stat-delta.down{color:var(--bad)}
  .nav-ico{width:18px; display:inline-flex; justify-content:center; font-size:14px; opacity:.9}
  .fychip{background:#eff6ff; color:#1e40af; border:1px solid #dbeafe; padding:5px 12px; border-radius:999px;
    font-size:12px; font-weight:600}
  .who-wrap{display:flex; align-items:center; gap:12px}
  .fy-select{border:1px solid #dbeafe; background:#eff6ff; color:#1e40af; font-weight:600; font-size:12px;
    border-radius:999px; padding:5px 10px; cursor:pointer}
  .fy-select:focus{outline:none; box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .refresh-btn{background:transparent; border:1px solid var(--line); border-radius:8px; width:30px; height:30px;
    cursor:pointer; color:var(--muted); font-size:16px; line-height:1}
  .refresh-btn:hover{border-color:var(--accent); color:var(--accent)}
  .bell{position:relative; background:transparent; border:none; font-size:18px; cursor:pointer; padding:2px 4px; line-height:1}
  .bell:hover{filter:brightness(1.1)}
  .bell-dot{position:absolute; top:-4px; right:-6px; background:#dc2626; color:#fff; font-size:10px;
    font-weight:700; min-width:16px; height:16px; line-height:16px; text-align:center; border-radius:999px; padding:0 3px}
  .panel:hover{box-shadow:0 2px 10px rgba(15,23,42,.05)}
  /* dashboard multi-panel grids */
  .grid2{display:grid; grid-template-columns:1.8fr 1fr; gap:16px; margin-bottom:22px}
  .grid-half{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:22px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:22px}
  @media(max-width:980px){ .grid2,.grid-half,.grid3{grid-template-columns:1fr} }
  .grid2 .panel,.grid-half .panel,.grid3 .panel{margin-bottom:0}
  /* ---- Owner dashboard: KPI grid, flow strip, alerts ---- */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
  .stat.clickable{cursor:pointer}
  .stat.clickable:hover{border-color:#bfdbfe}
  .stat.clickable:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .stat-sub{font-size:11.5px; color:var(--muted); margin-top:4px}
  .section-head{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin:6px 0 12px}
  .flow{display:flex; align-items:stretch; gap:6px; overflow-x:auto; padding-bottom:4px}
  .flow-stage{flex:1 1 0; min-width:120px; background:#f8fafc; border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; cursor:pointer; transition:background .15s,border-color .15s}
  .flow-stage:hover{background:#eff6ff; border-color:#bfdbfe}
  .flow-stage-name{font-size:12px; color:var(--muted); font-weight:600}
  .flow-stage-val{font-size:19px; font-weight:700; margin:4px 0 2px; letter-spacing:-.01em}
  .flow-stage-metric{font-size:11px; color:var(--muted)}
  .flow-arrow{display:flex; align-items:center; color:#94a3b8; font-size:18px; flex:0 0 auto}
  .alert-list{display:flex; flex-direction:column; gap:8px}
  .alert-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line);
    border-radius:10px; cursor:pointer; font-size:13px; background:#fff; transition:background .12s}
  .alert-row:hover{background:#f8fafc}
  .alert-dot{width:8px; height:8px; border-radius:999px; background:#94a3b8; flex:0 0 auto}
  .alert-row.bad .alert-dot{background:var(--bad)} .alert-row.warn .alert-dot{background:#f59e0b}
  .alert-row.info .alert-dot{background:var(--accent)}
  .alert-kind{font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--muted);
    background:#f1f5f9; border-radius:6px; padding:2px 7px}
  .alert-go{color:var(--accent); font-size:12px; font-weight:600}
  /* ---- responsive shell: hamburger + mobile drawer ---- */
  .hamburger{display:none; background:transparent; border:none; font-size:22px; line-height:1; cursor:pointer;
    margin-right:4px; color:var(--navy)}
  .scrim{display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:19}
  @media(max-width:1100px){ .kpi-grid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:860px){
    .sidebar{transform:translateX(-100%); transition:transform .22s ease; z-index:20; width:250px; box-shadow:2px 0 16px rgba(0,0,0,.25)}
    .app.drawer-open .sidebar{transform:translateX(0)}
    .app.drawer-open .scrim{display:block}
    .main{margin-left:0}
    .hamburger{display:inline-flex}
    .content{padding:16px}
    .topbar{padding:12px 16px}
    .topbar h1{font-size:15px}
    .who-wrap{gap:10px} .who-wrap .who{display:none}
  }
  @media(max-width:560px){
    .kpi-grid{grid-template-columns:1fr 1fr; gap:10px}
    .stats{grid-template-columns:1fr}
    .stat-value{font-size:19px}
    table{font-size:12px}
  }
  /* tables never force horizontal page scroll */
  .panel{overflow-x:auto}
  /* ---- reusable DataTable ---- */
  .dt-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .dt-search{width:240px; max-width:50vw; padding:8px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:13px; background:#fff}
  .dt-search:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .dt-count{color:var(--muted); font-size:12px}
  th.dt-th{cursor:pointer; user-select:none; white-space:nowrap}
  th.dt-th:hover{color:var(--accent)}
  .dt-pager{display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:12px; font-size:13px}
  tr.row-group td{font-weight:700; background:#f8fafc}
  .dt-expcol{width:34px}
  .dt-exp{background:transparent; border:1px solid var(--line); border-radius:6px; width:24px; height:24px;
    cursor:pointer; color:var(--muted); font-size:11px; line-height:1}
  .dt-exp:hover{border-color:var(--accent); color:var(--accent)}
  tr.dt-detail>td{background:#f8fafc; padding:14px}
  .util-row{display:flex; align-items:center; gap:10px; margin:9px 0; font-size:13px}
  .util-row .nm{width:150px; color:var(--ink)}
  .util-bar{flex:1; height:8px; background:#eef2f7; border-radius:999px; overflow:hidden}
  .util-fill{height:100%; border-radius:999px; background:var(--accent)}
  .util-row .pc{width:42px; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-weight:600}
  .legend{font-size:12.5px} .legend .lr{display:flex; align-items:center; gap:8px; margin:7px 0}
  .legend .dot{width:10px; height:10px; border-radius:3px; flex:0 0 auto}
  .act{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px}
  .act:last-child{border-bottom:0}
  .act .tt{color:var(--muted); width:70px; flex:0 0 auto}
  input,select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff;
    transition:border-color .12s, box-shadow .12s}
  input:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  button.btn{background:var(--accent); color:#fff; border:0; padding:9px 16px; border-radius:8px;
    cursor:pointer; font-size:13px; font-weight:600; transition:filter .12s, box-shadow .12s}
  button.btn:hover{filter:brightness(1.07); box-shadow:0 2px 8px rgba(37,99,235,.25)}
  button.btn.sec{background:#e2e8f0; color:#0f172a} button.btn.sec:hover{box-shadow:none; background:#cbd5e1}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:end}
  .field{display:flex; flex-direction:column; gap:5px} .field label{font-size:11.5px; color:var(--muted)}
  .login{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy)}
  .login .box{background:#fff; padding:34px; border-radius:16px; width:330px; box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .login h2{margin:0 0 4px} .login p{margin:0 0 20px; color:var(--muted); font-size:13px}
  .login .field{margin-bottom:14px} .login input{width:100%}
  .err{color:var(--bad); font-size:12.5px; margin-top:8px}
  .muted{color:var(--muted)} .mb{margin-bottom:16px}
  .chartbox{width:100%; height:260px}
</style>
</head>
<body>
<div id="root"></div>

<!-- Libraries are vendored locally (see vendor/) so the UI has no runtime CDN
     dependency. The app is precompiled from app.src.jsx to app.js (build-ui.sh). -->
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/prop-types.js"></script>
<script src="vendor/recharts.js"></script>
<script src="app.js"></script>
</body>
</html>
